services:
  - type: web
    name: solaris-letters-server
    env: node
    plan: free
    # Build and start from repo root — avoids spaces-in-path issues with rootDir
    buildCommand: cd "Solaris Letters/server" && npm install && npx prisma generate --schema=../prisma/schema.prisma
    startCommand: cd "Solaris Letters/server" && npx prisma migrate deploy --schema=../prisma/schema.prisma && npx tsx index.ts
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
