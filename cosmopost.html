<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CosmoPost — Solar System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
#c{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 1.2s}
#loading.hidden{opacity:0;pointer-events:none}
#loading svg{width:110px;height:110px;animation:spin 5s linear infinite;margin-bottom:28px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-title{font-size:22px;letter-spacing:8px;color:#FFD700;text-transform:uppercase;text-shadow:0 0 30px #FF8C00;margin-bottom:10px}
#loading-msg{font-size:12px;letter-spacing:3px;color:rgba(180,210,255,0.7);min-height:18px;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
#loading-bar{width:240px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:20px;overflow:hidden}
#loading-fill{height:100%;width:0;background:linear-gradient(90deg,#FF4500,#FFD700);animation:fill 2.5s ease-out forwards}
@keyframes fill{to{width:100%}}
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:100}
#nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;padding:10px 28px;background:rgba(5,8,20,0.82);border:1px solid rgba(100,180,255,0.14);border-radius:100px;pointer-events:all}
#nav-logo{font-size:13px;letter-spacing:5px;color:#FFD700;text-shadow:0 0 16px rgba(255,180,0,0.5)}
.nav-btn{background:none;border:none;color:rgba(160,200,255,0.6);font-family:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:3px 8px;border-radius:4px;transition:.2s}
.nav-btn:hover{color:#00E5FF;background:rgba(0,229,255,0.07)}
#badge{position:fixed;top:18px;right:20px;display:flex;align-items:center;gap:8px;padding:9px 16px;background:rgba(255,140,0,0.1);border:1px solid rgba(255,180,0,0.28);border-radius:100px;cursor:pointer;pointer-events:all;transition:.3s}
#badge:hover{background:rgba(255,140,0,0.2)}
#badge-icon{font-size:16px}
#badge-n{font-size:13px;color:#FFD700;font-weight:700}
#badge-lbl{font-size:9px;color:rgba(180,200,255,0.6);letter-spacing:1px}
#stats{position:fixed;top:18px;left:20px;display:flex;align-items:center;gap:14px;padding:9px 16px;background:rgba(5,8,20,0.8);border:1px solid rgba(100,180,255,0.12);border-radius:100px;pointer-events:none}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-n{font-size:13px;color:#00E5FF;font-weight:700}
.stat-l{font-size:8px;color:rgba(160,200,255,0.5);letter-spacing:1px;text-transform:uppercase}
.stat-div{width:1px;height:16px;background:rgba(100,180,255,0.1)}
#hint{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:4px;padding:10px 14px;background:rgba(5,8,20,0.7);border:1px solid rgba(100,180,255,0.1);border-radius:10px;pointer-events:none}
.hint-row{display:flex;align-items:center;gap:7px;font-size:10px;color:rgba(160,200,255,0.55)}
.key{background:rgba(100,180,255,0.08);border:1px solid rgba(100,180,255,0.14);border-radius:3px;padding:1px 6px;font-size:9px;color:rgba(160,200,255,0.6)}
#tooltip{position:fixed;display:none;pointer-events:none;padding:12px 16px;background:rgba(4,8,22,0.95);border:1px solid rgba(100,180,255,0.18);border-radius:10px;min-width:170px;z-index:200}
#tt-name{font-size:13px;font-weight:700;margin-bottom:3px}
#tt-type{font-size:10px;color:rgba(160,200,255,0.55);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
#tt-desc{font-size:11px;color:rgba(160,200,255,0.65);line-height:1.5}
#panel{position:fixed;left:20px;bottom:20px;width:280px;padding:20px;background:rgba(4,8,22,0.94);border:1px solid rgba(100,180,255,0.15);border-radius:16px;opacity:0;transform:translateY(16px);transition:.35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:200}
#panel.open{opacity:1;transform:translateY(0);pointer-events:all}
#pp-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#pp-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#pp-name{font-size:15px;font-weight:700;letter-spacing:1px}
#pp-close{margin-left:auto;background:none;border:none;color:rgba(160,200,255,0.5);font-size:18px;cursor:pointer;line-height:1}
#pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pp-cell{padding:9px 11px;background:rgba(100,180,255,0.04);border:1px solid rgba(100,180,255,0.08);border-radius:6px}
.pp-lbl{font-size:8px;color:rgba(160,200,255,0.45);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.pp-val{font-size:12px;color:rgba(200,225,255,0.9)}
#pp-desc{font-size:11px;color:rgba(160,200,255,0.6);line-height:1.6;margin-bottom:14px}
#pp-btn{width:100%;padding:10px;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.25);border-radius:8px;color:#00E5FF;font-family:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}
#pp-btn:hover{background:rgba(0,229,255,0.16);box-shadow:0 0 18px rgba(0,229,255,0.15)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Loading -->
<div id="loading">
  <svg viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="48" stroke="rgba(255,180,0,0.15)" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="34" stroke="rgba(255,180,0,0.12)" stroke-width="0.8"/>
    <ellipse cx="50" cy="50" rx="42" ry="16" stroke="rgba(100,180,255,0.3)" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="9" fill="url(#sg)"/>
    <circle cx="50" cy="50" r="13" fill="url(#gg)"/>
    <circle cx="92" cy="50" r="4" fill="#4AAFE5"/>
    <circle cx="50" cy="16" r="3" fill="#E8A05A"/>
    <defs>
      <radialGradient id="sg" cx="0.38" cy="0.32">
        <stop offset="0%" stop-color="#FFFAAA"/>
        <stop offset="55%" stop-color="#FFB020"/>
        <stop offset="100%" stop-color="#FF4400"/>
      </radialGradient>
      <radialGradient id="gg">
        <stop offset="0%" stop-color="rgba(255,160,40,0.3)"/>
        <stop offset="100%" stop-color="rgba(255,80,0,0)"/>
      </radialGradient>
    </defs>
  </svg>
  <div id="loading-title">Solar System</div>
  <div id="loading-msg">Charting the cosmos...</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="stats">
    <div class="stat"><span class="stat-n">8</span><span class="stat-l">Planets</span></div>
    <div class="stat-div"></div>
    <div class="stat"><span class="stat-n">3</span><span class="stat-l">Comets</span></div>
    <div class="stat-div"></div>
    <div class="stat"><span class="stat-n">15k</span><span class="stat-l">Stars</span></div>
  </div>
  <div id="nav">
    <div id="nav-logo">☀ COSMOPOST</div>
    <div style="width:1px;height:16px;background:rgba(100,180,255,0.12)"></div>
    <button class="nav-btn">Overview</button>
    <button class="nav-btn">Planets</button>
    <button class="nav-btn">Deep Space</button>
  </div>
  <div id="badge" onclick="window.setUnreadCount((window.unreadCount+1)%16)">
    <span id="badge-icon">☀</span>
    <div><div id="badge-n">0</div><div id="badge-lbl">Solar Events</div></div>
  </div>
</div>
<div id="tooltip"><div id="tt-name"></div><div id="tt-type"></div><div id="tt-desc"></div></div>
<div id="panel">
  <div id="pp-hdr"><div id="pp-dot"></div><div id="pp-name"></div><button id="pp-close" onclick="closePanel()">×</button></div>
  <div id="pp-grid">
    <div class="pp-cell"><div class="pp-lbl">Distance</div><div class="pp-val" id="pp-dist">—</div></div>
    <div class="pp-cell"><div class="pp-lbl">Period</div><div class="pp-val" id="pp-period">—</div></div>
    <div class="pp-cell"><div class="pp-lbl">Type</div><div class="pp-val" id="pp-type">—</div></div>
    <div class="pp-cell"><div class="pp-lbl">Moons</div><div class="pp-val" id="pp-moons">—</div></div>
  </div>
  <div id="pp-desc"></div>
  <button id="pp-btn">▸ EXPLORE</button>
</div>
<div id="hint">
  <div class="hint-row"><span class="key">drag</span> Rotate view</div>
  <div class="hint-row"><span class="key">scroll</span> Zoom</div>
  <div class="hint-row"><span class="key">click</span> Select planet</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// CosmoPost — Three.js r128 Solar System
(function(){

// ── Globals ──────────────────────────────────────────────────
window.unreadCount = 0;
window.planets = [];

// ── Init renderer ────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
window.renderer = renderer;

const scene = new THREE.Scene();
window.scene = scene;

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 30, 80);
window.camera = camera;

const clock = new THREE.Clock();
window.clock = clock;

// ── OrbitControls ────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 20;
controls.maxDistance = 400;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
let idleTimer = null;
canvas.addEventListener('pointerdown', ()=>{
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ controls.autoRotate = true; }, 5000);
});

// ── Star sprite texture ───────────────────────────────────────
function makeStarSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.2,'rgba(255,255,255,0.85)');
  g.addColorStop(0.5,'rgba(200,220,255,0.25)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

// ── Starfield ─────────────────────────────────────────────────
const STAR_N = 15000;
(function buildStars(){
  const pos = new Float32Array(STAR_N*3);
  const sz  = new Float32Array(STAR_N);
  const col = new Float32Array(STAR_N*3);
  const off = new Float32Array(STAR_N);
  const palette = [
    [0.69,0.77,1.0],[1,1,1],[1,0.91,0.49],[1,0.42,0.21],[0.8,0.88,1.0]
  ];
  const wt = [0.28,0.32,0.18,0.12,0.10];
  for(let i=0;i<STAR_N;i++){
    const r=900*Math.cbrt(Math.random());
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2]=r*Math.cos(ph);
    sz[i]=0.4+Math.random()*2.1;
    off[i]=Math.random()*Math.PI*2;
    let rn=Math.random(),cum=0,pi=0;
    for(let w=0;w<wt.length;w++){cum+=wt[w];if(rn<cum){pi=w;break;}}
    col[i*3]=palette[pi][0]; col[i*3+1]=palette[pi][1]; col[i*3+2]=palette[pi][2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aOffset',new THREE.BufferAttribute(off,1));
  const mat = new THREE.ShaderMaterial({
    uniforms:{ time:{value:0}, tex:{value:makeStarSprite()} },
    vertexShader:`
      attribute float aSize; attribute vec3 aColor; attribute float aOffset;
      uniform float time; varying vec3 vCol; varying float vAlpha;
      void main(){
        vCol=aColor;
        float tw=0.4+0.6*(0.5+0.5*sin(time*1.3+aOffset));
        vAlpha=tw;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=aSize*(270.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform sampler2D tex; varying vec3 vCol; varying float vAlpha;
      void main(){
        vec4 t=texture2D(tex,gl_PointCoord);
        if(t.r*vAlpha<0.01)discard;
        gl_FragColor=vec4(vCol,t.r*vAlpha);
      }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  window._starMat = mat;
  scene.add(new THREE.Points(geo,mat));
})();

// ── Milky Way ─────────────────────────────────────────────────
(function buildMilkyWay(){
  const geo = new THREE.TorusGeometry(700,120,16,64);
  const mat = new THREE.ShaderMaterial({
    uniforms:{ time:{value:0} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec2 vUv; uniform float time;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.0;a*=0.5;}return v;}
      void main(){
        float band=pow(1.0-smoothstep(0.0,0.45,abs(vUv.y-0.5)*2.2),2.0);
        float f=fbm(vUv*vec2(12.0,6.0)+time*0.006);
        float d=band*(f+fbm(vUv*vec2(24.0,12.0)-time*0.009)*0.35);
        vec3 c=mix(vec3(0.55,0.48,0.38),mix(vec3(0.9,0.9,1.0),vec3(0.65,0.78,1.0),band),d);
        gl_FragColor=vec4(c,d*0.18);
      }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
  });
  window._mwMat = mat;
  const m = new THREE.Mesh(geo,mat);
  m.rotation.x = Math.PI/6; m.rotation.z = 0.4;
  scene.add(m);
})();

// ── Nebulae ───────────────────────────────────────────────────
const nebDefs=[
  {col:[59,0,112], pos:[-260,100,-440], size:380, op:0.18},
  {col:[0,34,68],  pos:[320,-80,-520],  size:300, op:0.14},
  {col:[26,10,0],  pos:[60,220,-600],   size:260, op:0.20}
];
nebDefs.forEach(d=>{
  const c=document.createElement('canvas'); c.width=c.height=512;
  const ctx=c.getContext('2d');
  for(let l=0;l<5;l++){
    const ox=100+Math.random()*312, oy=100+Math.random()*312, r=80+Math.random()*160;
    const g=ctx.createRadialGradient(ox,oy,0,ox,oy,r);
    const al=(0.5+Math.random()*0.5);
    g.addColorStop(0,`rgba(${d.col[0]},${d.col[1]},${d.col[2]},${al})`);
    g.addColorStop(0.5,`rgba(${d.col[0]},${d.col[1]},${d.col[2]},${al*0.3})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,512,512);
  }
  const id=ctx.getImageData(0,0,512,512);
  for(let i=0;i<id.data.length;i+=4){
    const nv=0.5+0.5*Math.sin(i*0.0017)*Math.cos(i*0.0011);
    id.data[i+3]=Math.round(id.data[i+3]*nv);
  }
  ctx.putImageData(id,0,0);
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:d.op});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(d.size,d.size),mat);
  mesh.position.set(...d.pos);
  mesh.onBeforeRender=(_r,_s,cam)=>mesh.quaternion.copy(cam.quaternion);
  scene.add(mesh);
});


// cosmopost-sun.js — Sun shader, halos, flares, unread system

// ── Sun GLSL ShaderMaterial ───────────────────────────────────
const sunMat = new THREE.ShaderMaterial({
  uniforms:{ time:{value:0}, unreadIntensity:{value:0} },
  vertexShader:`
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewDir;
    void main(){
      vUv=uv; vNormal=normalize(normalMatrix*normal);
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      vViewDir=normalize(-mv.xyz);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform float time; uniform float unreadIntensity;
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewDir;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<6;i++){v+=a*ns(p);p*=2.1;a*=0.5;}return v;}
    void main(){
      float spd=1.0+unreadIntensity*2.5;
      float f=fbm(vUv*4.5+vec2(time*0.07*spd,time*0.055*spd));
      f+=fbm(vUv*9.0-vec2(time*0.045*spd,time*0.065*spd))*0.45;
      vec3 c0=vec3(0.94,0.21,0.0),c1=vec3(1.0,0.69,0.04),c2=vec3(1.0,0.94,0.58);
      vec3 plasma=mix(c0,c1,smoothstep(0.35,0.65,f));
      plasma=mix(plasma,c2,smoothstep(0.65,0.92,f));
      vec2 gc=fract(vUv*88.0+time*0.022*spd)-0.5;
      float grain=smoothstep(0.44,0.0,length(gc));
      plasma=mix(plasma,plasma*1.8,grain*0.3);
      float limb=clamp(dot(vNormal,vViewDir),0.0,1.0);
      plasma*=mix(0.15,1.0,pow(limb,0.42));
      float rim=pow(clamp(1.0-limb,0.0,1.0),2.6);
      vec3 chrom=vec3(1.0,0.96,0.86)*rim*2.8;
      plasma=mix(plasma,vec3(1.0,0.55,0.05),unreadIntensity*0.35);
      vec3 col=(plasma+chrom)*(1.0+unreadIntensity*0.85);
      gl_FragColor=vec4(col,1.0);
    }`
});
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(8,64,64), sunMat);
scene.add(sunMesh);
window._sunMat = sunMat;

// ── Halo texture helper ───────────────────────────────────────
function haloTex(c0,c1,sz=256){
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const ctx=cv.getContext('2d'), h=sz/2;
  const g=ctx.createRadialGradient(h,h,0,h,h,h);
  g.addColorStop(0,c0); g.addColorStop(0.5,c1); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(cv);
}
function haloMesh(r,tex,op,side=THREE.BackSide){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,32),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:op,side}));
  scene.add(m); return m;
}
const haloInner  = haloMesh(8.8, haloTex('rgba(255,240,120,0.95)','rgba(255,200,60,0.35)'),0.60);
const haloMiddle = haloMesh(11,  haloTex('rgba(255,140,20,0.85)', 'rgba(255,90,10,0.22)'), 0.25);
const haloOuter  = haloMesh(16,  haloTex('rgba(255,50,10,0.75)',  'rgba(180,20,0,0.08)'),  0.08);

// ── Sun point light ───────────────────────────────────────────
const sunLight = new THREE.PointLight(0xFFF5E0, 2.0, 0, 2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x111825, 0.55));
scene.add(new THREE.HemisphereLight(0x182040,0x080412,0.4));

// ── Solar Flares ──────────────────────────────────────────────
const flares=[];
let flareTimer=10+Math.random()*8;
function spawnFlare(){
  const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
  const dir=new THREE.Vector3(Math.sin(phi)*Math.cos(theta),Math.sin(phi)*Math.sin(theta),Math.cos(phi));
  const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(1,0.55,0.06),transparent:true,opacity:0.9,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(new THREE.ConeGeometry(0.28,14,5),mat);
  mesh.position.copy(dir.clone().multiplyScalar(8.4));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  scene.add(mesh);
  flares.push({mesh,mat,life:0,dur:1.5});
}
function updateFlares(dt,intensity){
  flareTimer-=dt;
  const interval = intensity>0.8?4:10+Math.random()*6;
  if(flareTimer<=0){ flareTimer=interval; spawnFlare(); }
  for(let i=flares.length-1;i>=0;i--){
    const f=flares[i]; f.life+=dt;
    const p=f.life/f.dur, grow=Math.sin(p*Math.PI);
    f.mesh.scale.set(grow*0.5,1+grow*1.3,grow*0.5);
    f.mat.opacity=grow*0.85;
    if(f.life>=f.dur){ scene.remove(f.mesh); flares.splice(i,1); }
  }
}

// ── Unread glow system ────────────────────────────────────────
let _unreadTarget=0, _unreadCurrent=0;
window.setUnreadCount=function(n){
  window.unreadCount=n;
  document.getElementById('badge-n').textContent=n;
  _unreadTarget=Math.min(n/16,1);
};

function updateSun(dt,elapsed){
  sunMat.uniforms.time.value=elapsed;
  _unreadCurrent+=(_unreadTarget-_unreadCurrent)*Math.min(dt/2,1);
  sunMat.uniforms.unreadIntensity.value=_unreadCurrent;
  // Corona pulse
  const pulse=1+0.03*Math.sin(elapsed*2.1+_unreadCurrent*1.5);
  haloMiddle.scale.setScalar(pulse);
  haloMiddle.material.opacity=0.25+_unreadCurrent*0.30;
  haloOuter.material.opacity =0.08+_unreadCurrent*0.22;
  updateFlares(dt,_unreadCurrent);
}


// cosmopost-planets.js — Planets, orbits, asteroid belt, interaction

// ── Planet texture generators ─────────────────────────────────
function mkEarth(seed){
  const S=512,cv=document.createElement('canvas'); cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#0b2f6a'; ctx.fillRect(0,0,S,S);
  for(let i=0;i<14;i++){
    const x=(Math.sin(i*91.3+seed)*.5+.5)*S, y=(Math.cos(i*71.7+seed)*.5+.5)*S;
    const r=25+(Math.sin(i*37.1)*.5+.5)*90;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(72,130,55,.92)'); g.addColorStop(.5,'rgba(55,100,38,.7)'); g.addColorStop(.85,'rgba(110,82,48,.4)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  }
  const c1=ctx.createLinearGradient(0,0,0,S*.18); c1.addColorStop(0,'rgba(220,235,255,.96)'); c1.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=c1; ctx.fillRect(0,0,S,S*.18);
  const c2=ctx.createLinearGradient(0,S*.82,0,S);  c2.addColorStop(0,'rgba(0,0,0,0)'); c2.addColorStop(1,'rgba(220,235,255,.96)'); ctx.fillStyle=c2; ctx.fillRect(0,S*.82,S,S*.18);
  return new THREE.CanvasTexture(cv);
}
function mkGas(seed){
  const S=512,cv=document.createElement('canvas'); cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#9A5A22'; ctx.fillRect(0,0,S,S);
  [[.04,.09,175,115,55,.82],[.16,.07,215,155,75,.62],[.26,.13,135,78,28,.78],[.42,.09,195,138,68,.58],[.54,.15,155,98,38,.72],[.72,.10,205,148,62,.52],[.84,.09,125,68,22,.82]].forEach(([y,h,r,g,b,a])=>{
    const bg=ctx.createLinearGradient(0,y*S,S,(y+h)*S);
    bg.addColorStop(0,`rgba(${r},${g},${b},${a})`); bg.addColorStop(.5,`rgba(${Math.min(255,r+18)},${g},${b},${a*.6})`); bg.addColorStop(1,`rgba(${r},${g},${b},${a})`);
    ctx.fillStyle=bg; ctx.fillRect(0,y*S,S,h*S);
  });
  const gx=S*(.55+(seed%9)*.04), gy=S*.54;
  const sg=ctx.createRadialGradient(gx,gy,0,gx,gy,38);
  sg.addColorStop(0,'rgba(195,55,28,.92)'); sg.addColorStop(.55,'rgba(170,44,18,.58)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(gx,gy,38,26,0,0,Math.PI*2); ctx.fill();
  return new THREE.CanvasTexture(cv);
}
function mkRocky(seed){
  const S=512,cv=document.createElement('canvas'); cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  const r=78+(seed*13)%42, g=58+(seed*7)%32, b=38+(seed*11)%22;
  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,S,S);
  for(let i=0;i<26;i++){
    const cx=Math.random()*S, cy=Math.random()*S, cr=7+Math.random()*32;
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
    cg.addColorStop(0,'rgba(18,13,8,.65)'); cg.addColorStop(.72,'rgba(38,28,18,.32)'); cg.addColorStop(.88,'rgba(95,75,55,.4)'); cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(cv);
}
function mkIce(seed){
  const S=512,cv=document.createElement('canvas'); cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#93B8D4'; ctx.fillRect(0,0,S,S);
  for(let i=0;i<28;i++){
    ctx.beginPath(); ctx.strokeStyle=`rgba(${140+Math.floor(Math.random()*80)},${178+Math.floor(Math.random()*58)},${208+Math.floor(Math.random()*44)},.6)`;
    ctx.lineWidth=.5+Math.random()*2;
    const sx=Math.random()*S, sy=Math.random()*S; ctx.moveTo(sx,sy);
    for(let j=0;j<6;j++) ctx.lineTo(sx+(Math.random()-.5)*88, sy+(Math.random()-.5)*88);
    ctx.stroke();
  }
  const c1=ctx.createLinearGradient(0,0,0,S*.26); c1.addColorStop(0,'rgba(238,246,255,.98)'); c1.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=c1; ctx.fillRect(0,0,S,S*.26);
  const c2=ctx.createLinearGradient(0,S*.74,0,S); c2.addColorStop(0,'rgba(0,0,0,0)'); c2.addColorStop(1,'rgba(238,246,255,.98)'); ctx.fillStyle=c2; ctx.fillRect(0,S*.74,S,S*.26);
  return new THREE.CanvasTexture(cv);
}

// ── Atmosphere rim shader ─────────────────────────────────────
function atmMat(col){
  return new THREE.ShaderMaterial({
    uniforms:{},
    vertexShader:`varying vec3 vN,vV; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 vN,vV; void main(){ float r=pow(max(1.0-dot(vN,vV),0.0),2.0); gl_FragColor=vec4(${col},r*0.68); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.BackSide
  });
}

// ── Orbit ring ────────────────────────────────────────────────
function addOrbit(r,e=0){
  const pts=[];
  for(let i=0;i<=256;i++){const a=i/256*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r*(1-e*.12)));}
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x3A6A99,transparent:true,opacity:.1,depthWrite:false}));
  scene.add(m); return m;
}

// ── Planet data ───────────────────────────────────────────────
const PDATA=[
  {id:'mercury',name:'Mercury',type:'rocky',  r:20, spd:.00215, sz:1.4, seed:1, moons:0, e:.06, offset:0.0,  dist:'0.39 AU', period:'88 d',  desc:'Scorched innermost world'},
  {id:'venus',  name:'Venus',  type:'earth',  r:28, spd:.00165, sz:2.0, seed:2, moons:0, e:.01, offset:1.2,  dist:'0.72 AU', period:'225 d', desc:'Shrouded in acid clouds'},
  {id:'earth',  name:'Earth',  type:'earth',  r:38, spd:.00130, sz:2.1, seed:3, moons:1, e:.02, offset:2.4,  dist:'1.00 AU', period:'365 d', desc:'Our pale blue home'},
  {id:'mars',   name:'Mars',   type:'rocky',  r:50, spd:.00098, sz:1.6, seed:4, moons:2, e:.09, offset:4.0,  dist:'1.52 AU', period:'687 d', desc:'The Red Planet'},
  {id:'jupiter',name:'Jupiter',type:'gas',    r:70, spd:.00055, sz:4.8, seed:5, moons:4, e:.05, offset:0.8,  dist:'5.20 AU', period:'11.9 yr',desc:'King of planets'},
  {id:'saturn', name:'Saturn', type:'gas',    r:92, spd:.00038, sz:4.0, seed:6, moons:3, e:.06, offset:3.5,  dist:'9.58 AU', period:'29.5 yr',desc:'Lord of the rings', rings:true},
  {id:'uranus', name:'Uranus', type:'ice',    r:112,spd:.00025, sz:3.0, seed:7, moons:2, e:.05, offset:1.9,  dist:'19.2 AU', period:'84 yr', desc:'Tilted ice giant'},
  {id:'neptune',name:'Neptune',type:'ice',    r:130,spd:.00016, sz:2.9, seed:8, moons:1, e:.01, offset:5.1,  dist:'30.1 AU', period:'165 yr',desc:'Supersonic winds'},
];

const ATM={'earth':'0.25,0.58,1.0','gas':'0.88,0.62,0.28','ice':'0.58,0.82,1.0','rocky':'0.58,0.36,0.20'};
const PCOL={'earth':'#3a8bdf','gas':'#d08830','ice':'#60b4d8','rocky':'#a06040'};

PDATA.forEach(d=>{
  const tex = d.type==='earth'?mkEarth(d.seed):d.type==='gas'?mkGas(d.seed):d.type==='ice'?mkIce(d.seed):mkRocky(d.seed);
  const geo = new THREE.SphereGeometry(d.sz,48,48);
  const mat = new THREE.MeshStandardMaterial({map:tex, emissiveMap:tex, emissive:new THREE.Color(1,1,1), emissiveIntensity:.16, roughness:d.type==='ice'?.32:.74, metalness:.04});
  const mesh= new THREE.Mesh(geo,mat);
  mesh.castShadow=true; mesh.receiveShadow=true;

  // Atmosphere
  const atm=new THREE.Mesh(new THREE.SphereGeometry(d.sz*1.06,32,32),atmMat(ATM[d.type]||'0.5,0.5,1.0'));
  mesh.add(atm);

  // Saturn rings
  if(d.rings){
    const rg=new THREE.Group(); rg.rotation.x=Math.PI/9;
    [0,1,2,3].forEach(i=>{
      const rm=new THREE.Mesh(new THREE.RingGeometry(d.sz*(1.55+i*.32),d.sz*(1.82+i*.32),80),
        new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(.08,.24,.46-i*.06),transparent:true,opacity:.62-i*.1,side:THREE.DoubleSide,depthWrite:false}));
      rg.add(rm);
    });
    mesh.add(rg);
  }

  const group=new THREE.Group();
  group.add(mesh);
  scene.add(group);
  addOrbit(d.r,d.e);

  const angle=d.offset??Math.random()*Math.PI*2;
  mesh.userData={...d,color:PCOL[d.type]||'#888', angle, group};
  window.planets.push(mesh);
});

// ── Asteroid belt ──────────────────────────────────────────────
(function(){
  const N=700, ageo=new THREE.IcosahedronGeometry(.12,0);
  const amat=new THREE.MeshStandardMaterial({color:0x6A604E,roughness:.94,metalness:.05});
  const inst=new THREE.InstancedMesh(ageo,amat,N);
  const angles=[], speeds=[], radii=[], scales=[], rotX=[], rotY=[];
  const dum=new THREE.Object3D();
  for(let i=0;i<N;i++){
    angles.push(Math.random()*Math.PI*2);
    speeds.push((Math.random()<.5?1:-1)*(8e-4+Math.random()*1.1e-3));
    radii.push(36+Math.random()*9);
    scales.push(.35+Math.random()*.9);
    rotX.push(Math.random()*Math.PI*2);
    rotY.push(Math.random()*Math.PI*2);
    dum.position.set(Math.cos(angles[i])*radii[i],(Math.random()-.5)*1.6,Math.sin(angles[i])*radii[i]);
    dum.scale.setScalar(scales[i]); dum.updateMatrix();
    inst.setMatrixAt(i,dum.matrix);
  }
  inst.instanceMatrix.needsUpdate=true;
  scene.add(inst);
  window._asteroids={inst,N,angles,speeds,radii,scales,rotX,rotY};
})();

function updateAsteroids(){
  const {inst,N,angles,speeds,radii,scales,rotX,rotY}=window._asteroids;
  const dum=new THREE.Object3D();
  for(let i=0;i<N;i++){
    angles[i]+=speeds[i]; rotX[i]+=.007; rotY[i]+=.005;
    dum.position.set(Math.cos(angles[i])*radii[i],(Math.random()-.5)*.03,Math.sin(angles[i])*radii[i]);
    dum.rotation.set(rotX[i],rotY[i],0); dum.scale.setScalar(scales[i]); dum.updateMatrix();
    inst.setMatrixAt(i,dum.matrix);
  }
  inst.instanceMatrix.needsUpdate=true;
}

// ── Planet animation ──────────────────────────────────────────
function updatePlanets(dt){
  window.planets.forEach(mesh=>{
    const d=mesh.userData;
    d.angle+=d.spd;
    const r=d.r, e=d.e||0;
    mesh.position.set(Math.cos(d.angle)*r, 0, Math.sin(d.angle)*r*(1-e*.12));
    mesh.rotation.y+=d.rotSpd||.004;
  });
  updateAsteroids();
}


// cosmopost-ui.js — interaction, raycasting, panel, animate loop

// ── Raycaster / interaction ───────────────────────────────────
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let hoveredMesh=null, selectedMesh=null;
const tooltip=document.getElementById('tooltip');
const panel=document.getElementById('panel');

canvas.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  tooltip.style.left=(e.clientX+16)+'px';
  tooltip.style.top=(e.clientY-10)+'px';
});

canvas.addEventListener('click',e=>{
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(window.planets);
  if(hits.length){
    openPanel(hits[0].object);
  } else {
    closePanel();
  }
});

function openPanel(mesh){
  selectedMesh=mesh;
  const d=mesh.userData;
  document.getElementById('pp-dot').style.cssText=`background:${d.color};box-shadow:0 0 10px ${d.color}`;
  document.getElementById('pp-name').textContent=d.name;
  document.getElementById('pp-dist').textContent=d.dist||'—';
  document.getElementById('pp-period').textContent=d.period||'—';
  document.getElementById('pp-type').textContent=d.type||'—';
  document.getElementById('pp-moons').textContent=d.moons??'0';
  document.getElementById('pp-desc').textContent=d.desc||'';
  panel.classList.add('open');
}
window.closePanel=function(){
  panel.classList.remove('open');
  selectedMesh=null;
};

// ── Hover tooltip ─────────────────────────────────────────────
function updateHover(){
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(window.planets);
  if(hits.length){
    const mesh=hits[0].object;
    if(mesh!==hoveredMesh){
      hoveredMesh=mesh;
      const d=mesh.userData;
      document.getElementById('tt-name').style.color=d.color;
      document.getElementById('tt-name').textContent=d.name;
      document.getElementById('tt-type').textContent=d.type;
      document.getElementById('tt-desc').textContent=d.desc||'';
    }
    tooltip.style.display='block';
    canvas.style.cursor='pointer';
  } else {
    hoveredMesh=null;
    tooltip.style.display='none';
    canvas.style.cursor='default';
  }
}

// ── Resize ────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── Loading screen ────────────────────────────────────────────
const msgs=['Charting the cosmos...','Calibrating orbital paths...','Warming up the sun...','Initializing deep space...'];
let mi=0;
const msgEl=document.getElementById('loading-msg');
const msgInt=setInterval(()=>{ mi=(mi+1)%msgs.length; msgEl.textContent=msgs[mi]; },1500);
setTimeout(()=>{
  clearInterval(msgInt);
  const ld=document.getElementById('loading');
  ld.classList.add('hidden');
  setTimeout(()=>ld.remove(),1300);
},2800);

// ── Animate ───────────────────────────────────────────────────
let _elapsed=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  _elapsed+=dt;
  if(window._starMat) window._starMat.uniforms.time.value=_elapsed;
  if(window._mwMat)   window._mwMat.uniforms.time.value=_elapsed;
  updateSun(dt,_elapsed);
  updatePlanets(dt);
  updateHover();
  controls.update();
  renderer.render(scene,camera);
}
animate();

})(); // end IIFE
</script>
